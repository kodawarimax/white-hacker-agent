name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run Unit & Sanitization Tests
        run: python3 -m unittest discover -s tests -v
      - name: Run Built-in Interactive Demo
        run: python3 white_hacker_runner.py demo
